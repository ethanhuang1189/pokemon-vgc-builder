name: Update Meta Stats

on:
  schedule:
    - cron: '0 12 * * *'   # Daily at noon UTC
  workflow_dispatch:         # Manual trigger from Actions tab

# Nothing gets write access unless a job asks for it below.
permissions:
  contents: read

concurrency:
  group: update-meta
  cancel-in-progress: false

jobs:
  # Runs third-party code (npm packages, Chrome, the scraped site) with a read-only token.
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Exact versions from the lockfile; --ignore-scripts so no package install hooks run.
      # puppeteer-core uses the runner's preinstalled Google Chrome.
      - name: Install scraper
        working-directory: scripts/scraper
        run: npm ci --ignore-scripts

      - name: Scrape Pikalytics
        run: node scripts/scraper/scrape-meta.cjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta-stats
          path: src/data/metaStats.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-screenshot
          path: scripts/scraper/debug.png
          if-no-files-found: ignore
          retention-days: 3

  # The only job that can push. It installs nothing and runs only this repo's own validator.
  commit:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-stats
          path: ${{ runner.temp }}/meta

      - name: Validate scraped data
        run: node scripts/validate-meta.mjs "$RUNNER_TEMP/meta/metaStats.json"

      - name: Commit if changed
        run: |
          cp "$RUNNER_TEMP/meta/metaStats.json" src/data/metaStats.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/metaStats.json
          git diff --cached --quiet || (git commit -m "chore: update meta stats" && git push)
