name: Update Meta Stats

on:
  schedule:
    - cron: '0 12 * * *'   # Daily at noon UTC
  workflow_dispatch:         # Manual trigger from Actions tab

# Nothing gets write access unless a job asks for it below.
permissions:
  contents: read

concurrency:
  group: update-meta
  cancel-in-progress: false

jobs:
  # Runs third-party code (npm packages, Chrome, the scraped site) with a read-only token.
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Exact versions from the lockfile; --ignore-scripts so no package install hooks run.
      # puppeteer-core uses the runner's preinstalled Google Chrome.
      - name: Install scraper
        working-directory: scripts/scraper
        run: npm ci --ignore-scripts

      - name: Scrape Pikalytics
        run: node scripts/scraper/scrape-meta.cjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meta-stats
          path: src/data/metaStats.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-screenshot
          path: scripts/scraper/debug.png
          if-no-files-found: ignore
          retention-days: 3

  # The only job that can push. It installs nothing and runs only this repo's own validator.
  commit:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meta-stats
          path: ${{ runner.temp }}/meta

      - name: Validate scraped data
        run: node scripts/validate-meta.mjs "$RUNNER_TEMP/meta/metaStats.json"

      - name: Commit if changed
        run: |
          cp "$RUNNER_TEMP/meta/metaStats.json" src/data/metaStats.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/metaStats.json
          git diff --cached --quiet || (git commit -m "chore: update meta stats" && git push)
